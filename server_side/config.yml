# Bengali PL-BERT. Drop this next to step_*.t7 in Utils/PLBERT_bn/.
# model_params must stay byte-identical to the training config.
model_params:
  vocab_size: 178
  hidden_size: 768
  num_attention_heads: 12
  intermediate_size: 2048
  max_position_embeddings: 512
  num_hidden_layers: 12
  dropout: 0.1
